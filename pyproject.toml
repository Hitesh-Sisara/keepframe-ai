[project]
name = "keepframe"
version = "0.1.0"
description = "KeepFrame: agentic photo culling on OpenCV 5 + AWS Graviton"
requires-python = "==3.12.*"
dependencies = [
  "boto3==1.43.108",
  "numpy==2.3.3",
  "opencv-contrib-python-headless==5.0.0.93",
  "pydantic==2.12.3",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Optional dependency groups (alphabetical, exact pins).
# agent: Strands (Claude on Amazon Bedrock by default via BedrockModel/boto3; the anthropic SDK backs the optional
# Anthropic-compatible provider) + bedrock-agentcore, the AgentCore Runtime SDK the HTTP service runs on
# (/invocations, /ping). Model provider: docs/AGENT.md "Model provider". Known pin facts: bedrock-agentcore 1.24.0 needs boto3>=1.43.72 (hence
# boto3 1.43.108); strands-agents 1.57.2 needs mcp<2.2 (hence mcp 2.1.1).
# The agent image installs services/agent_runtime/requirements-agent.txt (same pins).
agent = ["anthropic==1.11.0", "aws-embedded-metrics==3.5.0", "bedrock-agentcore==1.24.0", "mcp==2.1.1", "strands-agents==1.57.2", "strands-agents-tools==0.8.9"]
api = ["fastapi==0.142.2", "httpx==0.28.1", "mangum==0.22.0", "uvicorn==0.54.0"]
data = ["boto3==1.43.108", "psycopg[binary]==3.2.10", "pydantic==2.12.3", "requests==2.32.5"]
bench = ["matplotlib==3.11.2", "pandas==3.0.6", "psutil==7.2.2", "pyarrow==25.0.1", "scikit-learn==1.9.1"]
dev = ["boto3-stubs[dynamodb,ecs,s3,secretsmanager,stepfunctions]==1.43.108", "mypy==1.18.2", "pytest-cov==7.0.0", "pytest==8.4.2", "ruff==0.14.0", "types-PyYAML==6.0.12.20260906"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["keepframe"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["keepframe"]
